<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cla.ar</title>
<link rel="icon" type="image/x-icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --fg: #d3d7cf;
    --dim: #6b7570;
    --verde: #8ae234;
    --azul: #729fcf;
    font-family: "Ubuntu Mono", "DejaVu Sans Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #050805;
    color: var(--fg);
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    max-width: 760px;
    margin: 0 auto;
    font-size: 20px;
    line-height: 1.6;
  }

  .prompt .usr { color: var(--verde); font-weight: 700; }
  .prompt .dir { color: var(--azul); font-weight: 700; }

  h1 {
    margin: 4px 0 20px;
    font-size: clamp(40px, 10vw, 84px);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1;
  }

  .botones { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 0 20px; }

  a.boton {
    color: var(--verde);
    border: 1px solid var(--verde);
    padding: 4px 14px;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  a.boton:hover, a.boton:focus-visible {
    background: var(--verde);
    color: #050805;
    outline: none;
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: var(--fg);
    vertical-align: text-bottom;
    animation: parpadeo 1.1s steps(1) infinite;
  }
  @keyframes parpadeo { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>

<body>

<main>
  <div class="prompt"><span class="usr">invitado@cla.ar</span>:<span class="dir">~</span>$ whoami</div>
  <h1>CLA.AR</h1>

  <div class="prompt"><span class="usr">invitado@cla.ar</span>:<span class="dir">~</span>$ ./contacto</div>
  <div class="botones">
    <a class="boton" href="mailto:hola@cla.ar">hola@cla.ar</a>
  </div>

  <div class="prompt"><span class="usr">invitado@cla.ar</span>:<span class="dir">~</span>$ <span class="cursor"></span></div>
</main>

</body>
</html>
