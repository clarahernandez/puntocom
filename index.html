<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cla.ar</title>
<link rel="icon" href="images/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0a0a0a;
    color: #8a8a8a;
    font: 16px/1.7 "Ubuntu Mono", Consolas, monospace;
  }

  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 18vh 24px 48px;
  }

  h1 {
    margin: 0 0 12vh;
    font-size: 16px;
    font-weight: 400;
    color: #e5e5e5;
  }

  ol {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    gap: 24px;
    padding: 6px 0;
    opacity: 0;
    animation: aparecer 2.4s ease forwards;
    animation-delay: calc(var(--i, 0) * 0.6s + 0.4s);
  }

  .n { color: #3d3d3d; }

  li p {
    margin: 4px 0 0;
    font-size: 14px;
    line-height: 1.5;
    color: #555;
  }
  li p a.ext {
    color: #555;
    border-bottom: 1px solid #2a2a2a;
  }
  li p a.ext:hover, li p a.ext:focus-visible {
    color: #b5b5b5;
    border-color: #555;
  }

  a {
    color: #b5b5b5;
    text-decoration: none;
    transition: color 0.3s;
  }
  a:hover, a:focus-visible {
    color: #fff;
    outline: none;
  }

  footer {
    margin-top: 16vh;
    font-size: 14px;
  }
  footer a { color: #3d3d3d; }

  @keyframes aparecer { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    li { animation: none; opacity: 1; }
  }
</style>
</head>

<body>
<main>
  <h1>cla.ar</h1>

  <ol>
    <li style="--i:0">
      <span class="n">001</span>
      <div>
        <a href="un-poco-de-rio/">un poco de río</a>
        <p>Trabajo presentado en el domo del planetario para el Festival Experimental XV — desarrollado durante el <a class="ext" href="https://www.instagram.com/proyecto_espaciolab/" target="_blank" rel="noopener">Proyecto Espaciolab 2026</a></p>
      </div>
    </li>
  </ol>

  <footer><a href="mailto:hola@cla.ar">hola@cla.ar</a></footer>
</main>
</body>
</html>
