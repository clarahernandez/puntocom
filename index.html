<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Web sensorial</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<script>
function setup() {
  createCanvas(windowWidth, windowHeight);
  background(0);
}

function draw() {
  fill(255, 50);
  noStroke();
  
  // círculos que siguen el mouse
  circle(mouseX, mouseY, random(10, 60));
}
</script>

</body>
</html>
