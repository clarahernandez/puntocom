<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>cla.ar</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
    background: black;
    color: white;
  }

  /* Pantalla de entrada */
  #entrada {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: radial-gradient(circle at center, #0a0a0a, #000);
    z-index: 10;
    cursor: pointer;
  }

  #titulo {
    font-size: 18px;
    letter-spacing: 4px;
    opacity: 0.8;
  }

  #sub {
    font-size: 12px;
    opacity: 0.4;
    margin-top: 10px;
  }

  /* canvas de la obra */
  canvas {
    display: block;
  }
</style>
<link rel="icon" type="image/x-icon" href="images/favicon.png">
</head>

<body>

<!-- ENTRADA -->
<div id="entrada">
  <div id="titulo">ENTRAR</div>
  <div id="sub">tocar para empezar</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<script>
let activo = true;

function setup() {
  createCanvas(windowWidth, windowHeight);
  background(0);
}

function draw() {
  if (!activo) return;

  noStroke();
  fill(180, 220, 255, 20);

  // movimiento orgánico suave
  let x = mouseX + random(-10, 10);
  let y = mouseY + random(-10, 10);

  circle(x, y, random(10, 60));
}

// activar instalación
document.getElementById("entrada").addEventListener("click", () => {
  document.getElementById("entrada").style.display = "none";
  activo = true;
  background(0);
});

//desactivar instalación
document.addEventListener('click', () => {
    if(activo) {
	activo = false
	} else {
	activo = true
}
});

// resize
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>

</body>
</html>
